# GitHub Pages: il sito è statico (niente da compilare), si pubblica a ogni push su main.
# Due strade, una di riserva all'altra:
#  1. "pages": il deploy ufficiale di GitHub Actions; prova ad accendere Pages da solo (enablement).
#  2. "ramo":  copia il sito sul ramo gh-pages. Se la 1 non riesce ad accendere Pages:
#     Settings → Pages → Build and deployment → Deploy from a branch → gh-pages / (root).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepara il sito
        run: |
          mkdir _sito
          cp -r index.html assets _sito/
          touch _sito/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _sito
      - id: deploy
        uses: actions/deploy-pages@v4

  ramo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Prepara il sito
        run: |
          mkdir _sito
          cp -r index.html assets _sito/
          touch _sito/.nojekyll
      - name: Pubblica sul ramo gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _sito
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pages: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "pubblicato: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
